<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zuchat - kale</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header>
      <h1>zuchat and eat more kale</h1>
      <div id="status">checking…</div>
    </header>

    <main>
      <p id="intro" hidden>
        A FastAPI chat service behind Google OIDC, deployed to AWS ECS by Terraform.
        Sign in with Google to chat.
      </p>

      <ol id="log" aria-live="polite"></ol>

      <form id="composer" hidden>
        <textarea
          id="message"
          rows="2"
          placeholder="Ask something… (⏎ to send, ⇧⏎ for a new line)"
          required
        ></textarea>
      </form>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
