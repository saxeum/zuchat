<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="t d">
  <title id="t">Today: one repository, one deployable</title>
  <desc id="d">All application code, UI assets and Terraform live in one repository and ship as one image on one ECS task. The chart marks the five couplings that block a second team or a second deploy unit.</desc>
  <rect width="1100" height="640" fill="#ffffff"/>
  <style>
    .h1{font:700 24px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .sub{font:400 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5}
    .bt{font:700 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .bd{font:400 10.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .bd2{font:400 11px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .tag{font:700 9px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff}
    .warn{font:400 11px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#991b1b}
    .lbl{font:400 10.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#64748b}
    .li{font:400 11px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#7f1d1d}
  </style>
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="32" y="48" class="h1">Today: one repository, one deployable</text>
  <text x="32" y="72" class="sub">Measured at bf8fbf1 — 1,014 lines Python, 949 lines UI, 933 lines Terraform, 49 tests in one file</text>

  <!-- repo boundary -->
  <rect x="32" y="100" width="740" height="444" rx="10" fill="#fcfdff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="48" y="126" class="bt">github.com/saxeum/zuchat</text>
  <text x="756" y="126" class="lbl" text-anchor="end">one repo · one image · one ECS task</text>

  <!-- process boundary -->
  <rect x="52" y="142" width="700" height="298" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="66" y="163" class="lbl">single process — in-process state is safe only while there is exactly one task</text>

  <!-- row 1 -->
  <rect x="72" y="178" width="200" height="68" rx="8" class="box"/>
  <text x="86" y="200" class="bt">UI</text>
  <text x="86" y="218" class="bd">static/app.js · HTML · CSS</text>
  <text x="86" y="234" class="bd">same-origin fetch, no build step</text>
  <rect x="228" y="186" width="30" height="15" rx="4" fill="#b91c1c"/>
  <text x="243" y="197" class="tag" text-anchor="middle">C6</text>

  <rect x="302" y="178" width="200" height="68" rx="8" class="box"/>
  <text x="316" y="200" class="bt">HTTP surface</text>
  <text x="316" y="218" class="bd">app.py · pages · api_routes</text>
  <text x="316" y="234" class="bd">10 endpoints, auth at router level</text>

  <rect x="532" y="178" width="200" height="68" rx="8" class="box"/>
  <text x="546" y="200" class="bt">Auth</text>
  <text x="546" y="218" class="bd">auth.py · auth_routes.py</text>
  <text x="546" y="234" class="bd">signed cookie, shared secret</text>
  <rect x="688" y="186" width="30" height="15" rx="4" fill="#b91c1c"/>
  <text x="703" y="197" class="tag" text-anchor="middle">C5</text>

  <!-- row 2 -->
  <rect x="72" y="268" width="200" height="68" rx="8" class="box"/>
  <text x="86" y="290" class="bt">Policy and spend</text>
  <text x="86" y="308" class="bd">ratelimit.py · bodylimit.py</text>
  <text x="86" y="324" class="bd">counters live in this process</text>
  <rect x="228" y="276" width="30" height="15" rx="4" fill="#b91c1c"/>
  <text x="243" y="287" class="tag" text-anchor="middle">C4</text>

  <rect x="302" y="268" width="200" height="68" rx="8" class="box"/>
  <text x="316" y="290" class="bt">Provider client</text>
  <text x="316" y="308" class="bd">deepseek.py</text>
  <text x="316" y="324" class="bd">key and model chosen in the handler</text>

  <rect x="532" y="268" width="200" height="68" rx="8" class="box"/>
  <text x="546" y="290" class="bt">Config</text>
  <text x="546" y="308" class="bd">config.py</text>
  <text x="546" y="324" class="bd">one Settings, LLM key required</text>
  <rect x="688" y="276" width="30" height="15" rx="4" fill="#b91c1c"/>
  <text x="703" y="287" class="tag" text-anchor="middle">C2</text>

  <!-- global settings warning -->
  <rect x="72" y="352" width="660" height="34" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="84" y="374" class="warn">get_settings() is global and requires DEEPSEEK_API_KEY — /health, /login and /ready all load it (C2)</text>

  <text x="72" y="406" class="warn">Counters are dicts in this process: a second task silently doubles every budget (C4).</text>

  <!-- terraform in same repo -->
  <rect x="52" y="456" width="700" height="72" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.4"/>
  <text x="66" y="478" class="bt">Terraform — same repository, same commit</text>
  <text x="66" y="496" class="bd2">VPC · ALB · ECS · ECR · IAM · OIDC trust · GitHub repo settings (933 lines)</text>
  <text x="66" y="514" class="bd2" fill="#92400e">applied from this repo's CI on every push to master (C7, C8)</text>

  <!-- arrow to AWS -->
  <line x1="752" y1="492" x2="796" y2="492" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- right column: why a naive split fails -->
  <rect x="800" y="100" width="268" height="300" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.3"/>
  <text x="816" y="126" style="font:700 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#991b1b">Why a naive split fails</text>
  <text x="816" y="152" class="li">C2  every service would need</text>
  <text x="828" y="167" class="li">the LLM key (Settings is global)</text>
  <text x="816" y="191" class="li">C4  counters break the moment</text>
  <text x="828" y="206" class="li">there is a second task</text>
  <text x="816" y="230" class="li">C5  every service would share</text>
  <text x="828" y="245" class="li">the session signing key</text>
  <text x="816" y="269" class="li">C7  an app commit can change</text>
  <text x="828" y="284" class="li">production infrastructure</text>
  <text x="816" y="308" class="li">C8  a new repo means editing</text>
  <text x="828" y="323" class="li">the IAM trust anchor</text>
  <text x="816" y="347" class="li">C10 no contract tests, so a</text>
  <text x="828" y="362" class="li">split has no safety net</text>
  <text x="816" y="386" class="lbl" font-style="italic">C-numbers match the inventory in §2.1</text>

  <!-- AWS -->
  <rect x="800" y="440" width="268" height="140" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="816" y="466" class="bt">AWS production</text>
  <text x="816" y="490" class="bd2">· 1 ECS service, 1 task</text>
  <text x="816" y="510" class="bd2">· 1 ALB, 1 target group, no NAT</text>
  <text x="816" y="530" class="bd2">· 1 ECR repo, mutable tags (C9)</text>
  <text x="816" y="550" class="bd2">· prod credentials in this repo's CI</text>
  <text x="816" y="570" class="bd2">· provider key in the task environment</text>

  <text x="32" y="606" class="sub" font-size="12">Nothing here blocks one team. Every coupling above blocks a second one.</text>
</svg>
