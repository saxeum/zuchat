<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="t d">
  <title id="t">Target: a federated platform reached in stages</title>
  <desc id="d">Solid boxes ship in stages zero to three. Dashed boxes appear only when a named trigger fires. Contracts sit beneath the product as a versioned seam, and the platform repository is the only place holding cloud credentials.</desc>
  <rect width="1100" height="700" fill="#ffffff"/>
  <style>
    .h1{font:700 24px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .sub{font:400 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .name{font:700 13.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .body{font:400 10.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .own{font:400 10px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#64748b;font-style:italic}
    .pill{font:700 8.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff}
    .edge{font:400 9.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#64748b}
    .sec{font:700 12.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#1e3a8a}
    .plat{font:700 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#065f46}
    .note{font:400 11px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#64748b}
  </style>
  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <text x="32" y="48" class="h1">Target: a federated platform, reached in stages</text>
  <text x="32" y="72" class="sub">Solid ships in stages 0–3 · dashed only when a named trigger fires · arrows are the only allowed dependency direction</text>

  <!-- row 1 -->
  <rect x="40" y="118" width="180" height="112" rx="9" fill="#fafafa" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="52" y="142" class="name">zuchat-web</text>
  <rect x="146" y="192" width="62" height="16" rx="8" fill="#94a3b8"/>
  <text x="177" y="203" class="pill" text-anchor="middle">on trigger</text>
  <text x="52" y="164" class="body">static UI → CloudFront</text>
  <text x="52" y="181" class="body">no API code, no secrets</text>
  <text x="52" y="204" class="own">owner: frontend</text>

  <rect x="280" y="118" width="210" height="112" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="294" y="142" class="name">zuchat-app</text>
  <rect x="424" y="192" width="54" height="16" rx="8" fill="#3b82f6"/>
  <text x="451" y="203" class="pill" text-anchor="middle">stage 0–3</text>
  <text x="294" y="164" class="body">UI · auth · chat · policy</text>
  <text x="294" y="181" class="body">the product, still one deploy</text>
  <text x="294" y="204" class="own">owner: product team</text>

  <rect x="550" y="118" width="210" height="112" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="564" y="142" class="name">zuchat-model-gateway</text>
  <rect x="696" y="192" width="52" height="16" rx="8" fill="#7c3aed"/>
  <text x="722" y="203" class="pill" text-anchor="middle">stage 3</text>
  <text x="564" y="164" class="body">keys · allowlist · budgets · audit</text>
  <text x="564" y="181" class="body">one egress point for model traffic</text>
  <text x="564" y="204" class="own">owner: AI platform</text>

  <rect x="820" y="118" width="180" height="112" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="834" y="142" class="name">api.deepseek.com</text>
  <text x="834" y="170" class="body">external provider</text>
  <text x="834" y="187" class="body">reachable from the gateway</text>
  <text x="834" y="204" class="body">and from nowhere else</text>

  <!-- arrows -->
  <line x1="220" y1="174" x2="276" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="248" y="163" class="edge" text-anchor="middle">cookie</text>
  <text x="248" y="190" class="edge" text-anchor="middle">or JWT</text>

  <line x1="490" y1="174" x2="546" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="518" y="163" class="edge" text-anchor="middle">stream</text>
  <text x="518" y="190" class="edge" text-anchor="middle">+ usage</text>

  <line x1="760" y1="174" x2="816" y2="174" stroke="#64748b" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="788" y="163" class="edge" text-anchor="middle">TLS</text>
  <text x="788" y="190" class="edge" text-anchor="middle">+ key</text>

  <!-- contracts -->
  <line x1="130" y1="230" x2="130" y2="266" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <line x1="385" y1="230" x2="385" y2="266" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <line x1="655" y1="230" x2="655" y2="266" stroke="#60a5fa" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#b)"/>
  <rect x="40" y="270" width="720" height="68" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="56" y="293" class="sec">zuchat-contracts · stage 2</text>
  <text x="56" y="313" class="body">OpenAPI · SSE frame kinds · identity claims · error envelope · generated clients</text>
  <text x="56" y="330" class="body">additive-only within a major; oasdiff breaking fails every consumer's CI</text>

  <!-- future split -->
  <rect x="40" y="368" width="720" height="96" rx="8" fill="#fafafa" stroke="#cbd5e1" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="56" y="388" class="body" font-style="italic">lifts out of zuchat-app, one trigger at a time — never both without a reason</text>
  <rect x="56" y="400" width="330" height="50" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="70" y="420" style="font:700 11.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a">zuchat-identity</text>
  <text x="70" y="437" class="body">OIDC login → short-lived JWT · owner: security</text>
  <rect x="402" y="400" width="330" height="50" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="416" y="420" style="font:700 11.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a">zuchat-chat</text>
  <text x="416" y="437" class="body">orchestration + SSE · owner: product team</text>

  <!-- platform -->
  <rect x="40" y="496" width="960" height="106" rx="9" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.8"/>
  <text x="56" y="522" class="plat">zuchat-platform · stage 1</text>
  <text x="56" y="546" class="body" font-size="11">Terraform modules · environment roots · reusable CI workflows pinned by SHA</text>
  <text x="56" y="565" class="body" font-size="11">service and repository templates · services.yaml ownership registry</text>
  <text x="56" y="586" class="body" font-size="10.5" fill="#065f46">the only repository with an AWS apply role; application repos hold no cloud credential</text>
  <rect x="812" y="510" width="172" height="26" rx="6" fill="#b91c1c"/>
  <text x="898" y="527" class="pill" text-anchor="middle" font-size="9.5">no AWS write in app repos</text>

  <!-- legend -->
  <rect x="40" y="630" width="26" height="14" rx="3" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="74" y="642" class="note">ships in stages 0–3</text>
  <rect x="252" y="630" width="26" height="14" rx="3" fill="#fafafa" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="286" y="642" class="note">created only on a trigger</text>
  <rect x="474" y="630" width="26" height="14" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="508" y="642" class="note">outside the trust boundary</text>

  <text x="40" y="676" class="note" font-size="11">One repository per reason to change. Web, identity and chat are not split until §7 fires.</text>
</svg>
