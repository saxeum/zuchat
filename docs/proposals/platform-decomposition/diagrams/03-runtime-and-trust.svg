<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" role="img" aria-labelledby="t d">
  <title id="t">Runtime and trust boundaries of the platform</title>
  <desc id="d">A browser reaches CloudFront for the surface app and one shared ALB for runs. The ALB routes to the platform, which holds the run gateway, orchestrator, model router and tool executor. Only the platform can read the provider key and reach the provider. Budgets live in DynamoDB, audit in CloudWatch. Publishing comes from a team repository through OIDC, with no static credential.</desc>
  <rect width="1100" height="660" fill="#ffffff"/>
  <style>
    .h1{font:700 24px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .sub{font:400 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .bt{font:700 12.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .bd{font:400 10px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .grp{font:700 10.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1px;fill:#334155}
    .edge{font:400 9px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#64748b}
    .note{font:400 11px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
  </style>
  <defs>
    <marker id="t1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="t2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b91c1c"/>
    </marker>
    <marker id="t3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="30" y="46" class="h1">Runtime and trust boundaries: what can reach what</text>
  <text x="30" y="70" class="sub">One shared load balancer, one egress point, one place that can read a provider key</text>

  <rect x="880" y="18" width="200" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="894" y="42" class="bt">api.deepseek.com</text>
  <text x="894" y="62" class="bd">external provider</text>

  <rect x="20" y="300" width="150" height="84" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="34" y="324" class="bt">Browser</text>
  <text x="34" y="344" class="bd">loads the surface app</text>
  <text x="34" y="361" class="bd">cookie plus JWT</text>

  <rect x="200" y="100" width="880" height="330" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="218" y="128" class="grp">AWS ACCOUNT · ONE VPC · NO NAT</text>
  <text x="1062" y="128" class="edge" text-anchor="end">public subnets; tasks need a public IP for ECR, logs and secrets</text>

  <rect x="230" y="150" width="170" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="244" y="174" class="bt" font-size="12">CloudFront + S3</text>
  <text x="244" y="194" class="bd">web-&lt;surface&gt; build</text>
  <text x="244" y="210" class="bd">no credentials</text>

  <rect x="230" y="262" width="170" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="244" y="286" class="bt" font-size="12">Shared ALB</text>
  <text x="244" y="306" class="bd">/api/* → platform</text>
  <text x="244" y="322" class="bd">WAF rate rules</text>

  <rect x="450" y="150" width="280" height="182" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.7"/>
  <text x="464" y="174" class="bt">zuchat-platform</text>
  <text x="464" y="196" class="bd">run gateway + orchestrator</text>
  <text x="464" y="213" class="bd">model router + tool executor</text>
  <text x="464" y="230" class="bd">registry · budgets · audit</text>
  <text x="464" y="252" class="bd" fill="#6d28d9">one deploy unit. Not microservices.</text>
  <rect x="464" y="268" width="252" height="22" rx="5" fill="#ede9fe"/>
  <text x="590" y="283" class="bd" fill="#5b21b6" text-anchor="middle">the only task role that can read the provider key</text>

  <rect x="780" y="150" width="170" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="794" y="174" class="bt" font-size="12">DynamoDB</text>
  <text x="794" y="194" class="bd">budgets and spend</text>
  <text x="794" y="210" class="bd">shared across tasks</text>

  <rect x="780" y="240" width="170" height="70" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="794" y="264" class="bt" font-size="12">Secrets Manager</text>
  <text x="794" y="284" class="bd">provider key</text>
  <text x="794" y="300" class="bd">platform task role only</text>

  <rect x="780" y="330" width="170" height="70" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="794" y="354" class="bt" font-size="12">CloudWatch + S3</text>
  <text x="794" y="374" class="bd">audit, traces, alarms</text>
  <text x="794" y="390" class="bd">one record per run</text>

  <!-- traffic -->
  <line x1="170" y1="342" x2="226" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#t1)"/>
  <text x="176" y="252" class="edge">static</text>
  <line x1="170" y1="356" x2="226" y2="314" stroke="#64748b" stroke-width="1.5" marker-end="url(#t1)"/>
  <text x="180" y="374" class="edge">API</text>
  <line x1="400" y1="297" x2="446" y2="297" stroke="#64748b" stroke-width="1.5" marker-end="url(#t1)"/>
  <text x="423" y="288" class="edge" text-anchor="middle">runs</text>

  <!-- platform to provider -->
  <path d="M 590 150 L 590 60 L 866 60" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#t2)"/>
  <text x="728" y="51" class="edge" fill="#b91c1c" text-anchor="middle">TLS + key · the only provider egress</text>

  <!-- platform to state -->
  <line x1="730" y1="185" x2="776" y2="185" stroke="#64748b" stroke-width="1.4" marker-end="url(#t1)"/>
  <text x="753" y="177" class="edge" text-anchor="middle">budgets</text>
  <line x1="730" y1="275" x2="776" y2="275" stroke="#b91c1c" stroke-width="1.4" marker-end="url(#t2)"/>
  <text x="753" y="267" class="edge" fill="#b91c1c" text-anchor="middle">key</text>
  <line x1="730" y1="365" x2="776" y2="365" stroke="#64748b" stroke-width="1.4" marker-end="url(#t1)"/>
  <text x="753" y="357" class="edge" text-anchor="middle">audit</text>

  <!-- publish path -->
  <rect x="450" y="470" width="280" height="76" rx="8" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="464" y="494" class="bt">team repo + CI (GitHub)</text>
  <text x="464" y="514" class="bd">publish: validate · eval · human merges</text>
  <text x="464" y="530" class="bd">OIDC only — no static deploy credential</text>
  <line x1="590" y1="466" x2="590" y2="436" stroke="#059669" stroke-width="1.6" marker-end="url(#t3)"/>
  <text x="600" y="454" class="edge" fill="#047857">publish</text>

  <text x="30" y="584" class="note">· only the platform task role can read the provider key; product repositories hold no AWS role at all</text>
  <text x="30" y="606" class="note">· only the platform has egress to a provider; a product service cannot reach one even if it tries</text>
  <text x="30" y="628" class="note">· budgets live in DynamoDB, so a second task or a second service cannot double the spend</text>
  <text x="30" y="650" class="note">· one ALB for every service: a second ALB adds about $25/month and no isolation a security group cannot give</text>
</svg>
