<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="t d">
  <title id="t">Runtime and trust boundaries of the target platform</title>
  <desc id="d">A browser reaches CloudFront for static assets and one shared ALB for API calls. The ALB routes by host and path to identity and chat services. Chat calls the model gateway, which is the only service that can read the provider key and the only one with egress to the model provider. Quota counters and audit records live outside the services.</desc>
  <rect width="1100" height="640" fill="#ffffff"/>
  <style>
    .h1{font:700 24px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .sub{font:400 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .bt{font:700 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .bd{font:400 10.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .zone{font:700 12px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#334155}
    .edge{font:400 9.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#64748b;paint-order:stroke;stroke:#ffffff;stroke-width:3.2;stroke-linejoin:round}
    .note{font:400 11px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
  </style>
  <defs>
    <marker id="m1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="m2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="30" y="46" class="h1">Runtime and trust boundaries</text>
  <text x="30" y="70" class="sub">One shared load balancer, name-based routing, and one egress point for model traffic</text>

  <!-- external provider -->
  <rect x="880" y="18" width="200" height="62" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="894" y="42" class="bt" font-size="12.5">api.deepseek.com</text>
  <text x="894" y="62" class="bd">external provider</text>

  <!-- browser -->
  <rect x="20" y="330" width="150" height="84" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="34" y="354" class="bt">Browser</text>
  <text x="34" y="374" class="bd">loads the static UI</text>
  <text x="34" y="391" class="bd">cookie plus JWT</text>

  <!-- AWS boundary -->
  <rect x="200" y="100" width="880" height="430" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="218" y="128" class="zone">AWS account · one VPC · no NAT gateway</text>
  <text x="1062" y="128" class="edge" text-anchor="end">public subnets; tasks need a public IP for ECR, logs and secrets</text>

  <!-- row 1 -->
  <rect x="230" y="150" width="180" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="244" y="174" class="bt" font-size="12.5">CloudFront + S3</text>
  <text x="244" y="194" class="bd">static UI only</text>
  <text x="244" y="210" class="bd">no API code, no secrets</text>

  <rect x="460" y="150" width="180" height="76" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="474" y="174" class="bt" font-size="12.5">zuchat-identity</text>
  <text x="474" y="194" class="bd">/login /auth /logout</text>
  <text x="474" y="210" class="bd">issues short-lived JWT</text>

  <rect x="700" y="150" width="180" height="76" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.6"/>
  <text x="714" y="174" class="bt" font-size="12.5">Secrets Manager</text>
  <text x="714" y="194" class="bd">provider key</text>
  <text x="714" y="210" class="bd">gateway task role only</text>

  <!-- row 2 -->
  <rect x="230" y="290" width="180" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="244" y="314" class="bt">Shared ALB</text>
  <text x="244" y="334" class="bd">auth.* → identity</text>
  <text x="244" y="351" class="bd">/api/* → chat</text>

  <rect x="460" y="290" width="180" height="86" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="474" y="314" class="bt" font-size="12.5">zuchat-chat</text>
  <text x="474" y="334" class="bd">/api/chat and stream</text>
  <text x="474" y="351" class="bd">no provider key</text>

  <rect x="700" y="290" width="180" height="86" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="714" y="314" class="bt" font-size="12.5">zuchat-model-gateway</text>
  <text x="714" y="334" class="bd">allowlist · policy · audit</text>
  <text x="714" y="351" class="bd">the only provider key</text>

  <!-- row 3 -->
  <rect x="700" y="436" width="180" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="714" y="460" class="bt" font-size="12.5">DynamoDB</text>
  <text x="714" y="480" class="bd">quota and spend counters</text>
  <text x="714" y="496" class="bd">conditional writes</text>

  <rect x="910" y="290" width="150" height="86" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="924" y="314" class="bt" font-size="12.5">CloudWatch + S3</text>
  <text x="924" y="334" class="bd">audit per request</text>
  <text x="924" y="351" class="bd">spend, traces, alarms</text>

  <!-- traffic arrows -->
  <line x1="170" y1="352" x2="226" y2="196" stroke="#64748b" stroke-width="1.5" marker-end="url(#m1)"/>
  <rect x="174" y="244" width="36" height="14" fill="#ffffff"/>
  <text x="176" y="255" class="edge">static</text>
  <line x1="170" y1="366" x2="226" y2="336" stroke="#64748b" stroke-width="1.5" marker-end="url(#m1)"/>
  <rect x="178" y="374" width="28" height="14" fill="#ffffff"/>
  <text x="180" y="385" class="edge">API</text>

  <line x1="410" y1="312" x2="456" y2="204" stroke="#64748b" stroke-width="1.4" marker-end="url(#m1)"/>
  <line x1="410" y1="338" x2="456" y2="338" stroke="#64748b" stroke-width="1.4" marker-end="url(#m1)"/>

  <line x1="640" y1="333" x2="696" y2="333" stroke="#64748b" stroke-width="1.4" marker-end="url(#m1)"/>
  <rect x="643" y="314" width="50" height="14" fill="#f8fafc"/>
  <text x="668" y="325" class="edge" text-anchor="middle">internal</text>

  <line x1="790" y1="226" x2="790" y2="286" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#m2)"/>
  <rect x="796" y="250" width="54" height="14" fill="#f8fafc"/>
  <text x="798" y="261" class="edge" fill="#b91c1c">read key</text>

  <line x1="790" y1="376" x2="790" y2="432" stroke="#64748b" stroke-width="1.4" marker-end="url(#m1)"/>
  <rect x="796" y="400" width="42" height="14" fill="#f8fafc"/>
  <text x="798" y="411" class="edge">spend</text>

  <line x1="880" y1="322" x2="906" y2="322" stroke="#64748b" stroke-width="1.4" marker-end="url(#m1)"/>
  <rect x="878" y="346" width="34" height="14" fill="#f8fafc"/>
  <text x="893" y="357" class="edge" text-anchor="middle">audit</text>

  <!-- gateway to provider -->
  <path d="M 720 290 L 672 290 L 672 60 L 866 60" fill="none" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#m2)"/>
  <rect x="744" y="40" width="70" height="14" fill="#ffffff"/>
  <text x="778" y="51" class="edge" fill="#b91c1c" text-anchor="middle">TLS + key</text>

  <!-- notes -->
  <text x="30" y="566" class="note">· only the gateway task role can read the provider key; application tasks have no internet egress</text>
  <text x="30" y="588" class="note">· quota counters live in DynamoDB, so a second task or a second service cannot double the budget</text>
  <text x="30" y="610" class="note">· one ALB for every service: a second ALB adds about $25/month and no isolation a security group cannot give</text>
</svg>
