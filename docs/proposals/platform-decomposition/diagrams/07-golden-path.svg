<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-labelledby="t d">
  <title id="t">The golden path for shipping a new agent</title>
  <desc id="d">Four steps: declare a manifest and prompt, evaluate with recorded fixtures, publish an immutable version through a merged pull request, and consume it from an SDK or catalog-driven UI. None of the steps requires a new repository, Terraform, a provider key, or a change to the runtime.</desc>
  <rect width="1100" height="440" fill="#ffffff"/>
  <style>
    .h1{font:700 24px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .sub{font:400 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .num{font:700 11px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff}
    .ttl{font:700 12.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .kick{font:700 8px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:0.8px;fill:#94a3b8}
    .bd{font:400 9.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#334155}
    .time{font:700 9.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#1d4ed8}
    .band{font:700 12px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#065f46}
  </style>
  <defs>
    <marker id="gp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="32" y="46" class="h1">The golden path: a new agent, four steps</text>
  <text x="32" y="70" class="sub">Everything a product team does. None of it touches the runtime, the infrastructure, or another team's code.</text>

  <!-- step 1 -->
  <rect x="40" y="112" width="240" height="204" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <circle cx="66" cy="140" r="13" fill="#2563eb"/>
  <text x="66" y="144" class="num" text-anchor="middle">1</text>
  <text x="90" y="145" class="ttl">Declare</text>
  <line x1="56" y1="160" x2="264" y2="160" stroke="#dbeafe" stroke-width="1.2"/>
  <text x="56" y="180" class="kick">TEAM</text>
  <text x="56" y="198" class="bd">agent.yaml, prompt,</text>
  <text x="56" y="213" class="bd">input and output schemas</text>
  <text x="56" y="236" class="kick">PLATFORM</text>
  <text x="56" y="254" class="bd">validates the manifest</text>
  <text x="56" y="269" class="bd">in the team's CI</text>
  <rect x="56" y="284" width="92" height="20" rx="5" fill="#dbeafe"/>
  <text x="102" y="298" class="time" text-anchor="middle">~30 minutes</text>

  <line x1="280" y1="214" x2="296" y2="214" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#gp)"/>

  <!-- step 2 -->
  <rect x="300" y="112" width="240" height="204" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <circle cx="326" cy="140" r="13" fill="#2563eb"/>
  <text x="326" y="144" class="num" text-anchor="middle">2</text>
  <text x="350" y="145" class="ttl">Evaluate</text>
  <line x1="316" y1="160" x2="524" y2="160" stroke="#dbeafe" stroke-width="1.2"/>
  <text x="316" y="180" class="kick">TEAM</text>
  <text x="316" y="198" class="bd">write fixtures and</text>
  <text x="316" y="213" class="bd">set the pass-rate bar</text>
  <text x="316" y="236" class="kick">PLATFORM</text>
  <text x="316" y="254" class="bd">runs the pydantic-evals</text>
  <text x="316" y="269" class="bd">dataset in CI</text>
  <rect x="316" y="284" width="92" height="20" rx="5" fill="#dbeafe"/>
  <text x="362" y="298" class="time" text-anchor="middle">CI minutes</text>

  <line x1="540" y1="214" x2="556" y2="214" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#gp)"/>

  <!-- step 3 -->
  <rect x="560" y="112" width="240" height="204" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <circle cx="586" cy="140" r="13" fill="#2563eb"/>
  <text x="586" y="144" class="num" text-anchor="middle">3</text>
  <text x="610" y="145" class="ttl">Publish</text>
  <line x1="576" y1="160" x2="784" y2="160" stroke="#dbeafe" stroke-width="1.2"/>
  <text x="576" y="180" class="kick">TEAM</text>
  <text x="576" y="198" class="bd">open the pull request;</text>
  <text x="576" y="213" class="bd">a human merges it</text>
  <text x="576" y="236" class="kick">PLATFORM</text>
  <text x="576" y="254" class="bd">immutable version,</text>
  <text x="576" y="269" class="bd">digest, eval report</text>
  <rect x="576" y="284" width="92" height="20" rx="5" fill="#dbeafe"/>
  <text x="622" y="298" class="time" text-anchor="middle">one PR</text>

  <line x1="800" y1="214" x2="816" y2="214" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#gp)"/>

  <!-- step 4 -->
  <rect x="820" y="112" width="240" height="204" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.4"/>
  <circle cx="846" cy="140" r="13" fill="#2563eb"/>
  <text x="846" y="144" class="num" text-anchor="middle">4</text>
  <text x="870" y="145" class="ttl">Consume</text>
  <line x1="836" y1="160" x2="1044" y2="160" stroke="#dbeafe" stroke-width="1.2"/>
  <text x="836" y="180" class="kick">TEAM</text>
  <text x="836" y="198" class="bd">a catalog page, or an</text>
  <text x="836" y="213" class="bd">SDK call in their UI</text>
  <text x="836" y="236" class="kick">PLATFORM</text>
  <text x="836" y="254" class="bd">AG-UI events, retries,</text>
  <text x="836" y="269" class="bd">no per-agent code</text>
  <rect x="836" y="284" width="132" height="20" rx="5" fill="#dbeafe"/>
  <text x="902" y="298" class="time" text-anchor="middle">no runtime change</text>

  <!-- band -->
  <rect x="40" y="344" width="1020" height="52" rx="9" fill="#ecfdf5" stroke="#34d399" stroke-width="1.6"/>
  <text x="60" y="366" class="band">No new repository · no Terraform · no provider key · no runtime pull request.</text>
  <text x="60" y="386" class="bd" font-size="10.5" fill="#065f46">Target: first agent in a day, the twentieth agent in about an hour. If either is false, the platform is not finished.</text>

  <text x="32" y="424" class="bd" font-size="10" fill="#64748b">The same four steps apply to a new UI: it lists agents by label, renders inputs from their schemas, and streams runs through the SDK.</text>
</svg>
