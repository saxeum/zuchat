<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="t d">
  <title id="t">Control plane and data plane of the agent platform</title>
  <desc id="d">The control plane takes manifests from a team repo through validation and an eval gate into an immutable registry with compiled policy. The data plane takes run requests from an SDK or API client through a run gateway and orchestrator, which calls a model router and a tool executor, and writes audit, traces and spend to a run log.</desc>
  <rect width="1100" height="700" fill="#ffffff"/>
  <style>
    .h1{font:700 24px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .sub{font:400 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .bt{font:700 12.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .bd{font:400 10px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .grp{font:700 10.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1px}
    .edge{font:400 9px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#64748b}
    .note{font:400 11px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
  </style>
  <defs>
    <marker id="g1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7c3aed"/>
    </marker>
    <marker id="g2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="32" y="46" class="h1">Two planes: who may run what, and what happens on a run</text>
  <text x="32" y="70" class="sub">The control plane changes rarely and carries governance. The data plane changes often and carries traffic.</text>

  <!-- control plane -->
  <rect x="40" y="100" width="380" height="560" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/>
  <text x="56" y="126" class="grp" fill="#5b21b6">CONTROL PLANE</text>

  <rect x="60" y="146" width="340" height="86" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="74" y="170" class="bt">team repo: agents-support/</text>
  <text x="74" y="190" class="bd">agent.yaml · prompts/ · schemas/ · evals/</text>
  <text x="74" y="208" class="bd">a pull request, not a service</text>

  <line x1="230" y1="232" x2="230" y2="272" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#g1)"/>
  <text x="240" y="256" class="edge">PR</text>

  <rect x="60" y="276" width="340" height="86" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="74" y="300" class="bt">validate + eval gate</text>
  <text x="74" y="320" class="bd">schema · policy · recorded fixtures</text>
  <text x="74" y="338" class="bd">a failing eval cannot be published</text>

  <line x1="230" y1="362" x2="230" y2="402" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#g1)"/>
  <text x="240" y="386" class="edge">pass</text>

  <rect x="60" y="406" width="340" height="86" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="74" y="430" class="bt">registry — immutable</text>
  <text x="74" y="450" class="bd">support-triage@1.4.0 · channels</text>
  <text x="74" y="468" class="bd">policy compiled into the version</text>

  <line x1="230" y1="492" x2="230" y2="532" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#g1)"/>
  <text x="240" y="516" class="edge">record</text>

  <rect x="60" y="536" width="340" height="74" rx="8" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.4"/>
  <text x="74" y="560" class="bt">publish audit</text>
  <text x="74" y="580" class="bd">who published what, when,</text>
  <text x="74" y="596" class="bd">with the eval report attached</text>

  <!-- data plane -->
  <rect x="450" y="100" width="610" height="560" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="466" y="126" class="grp" fill="#1d4ed8">DATA PLANE</text>

  <rect x="470" y="146" width="270" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="484" y="170" class="bt">web-&lt;surface&gt; (SDK)</text>
  <text x="484" y="190" class="bd">catalog-driven or bespoke</text>
  <text x="484" y="206" class="bd">no SSE parser, no provider key</text>

  <rect x="760" y="146" width="280" height="70" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="774" y="170" class="bt">another agent or API client</text>
  <text x="774" y="190" class="bd">same contract, same events</text>
  <text x="774" y="206" class="bd">no special-casing per consumer</text>

  <line x1="600" y1="216" x2="600" y2="252" stroke="#2563eb" stroke-width="1.5" marker-end="url(#g2)"/>
  <line x1="900" y1="216" x2="900" y2="252" stroke="#2563eb" stroke-width="1.5" marker-end="url(#g2)"/>

  <rect x="470" y="256" width="570" height="68" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.7"/>
  <text x="484" y="280" class="bt">POST /v1/agents/{name}/runs</text>
  <text x="484" y="300" class="bd">typed events stream back: run.started · output.delta · tool.call · output.final · run.completed</text>
  <text x="484" y="316" class="bd">cancel on disconnect · idempotency key · one trace per run</text>

  <line x1="595" y1="324" x2="595" y2="366" stroke="#2563eb" stroke-width="1.5" marker-end="url(#g2)"/>

  <rect x="470" y="370" width="250" height="80" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="484" y="394" class="bt">orchestrator</text>
  <text x="484" y="414" class="bd">model → tool → model</text>
  <text x="484" y="432" class="bd">timeouts, cancellation, caps</text>

  <line x1="720" y1="410" x2="756" y2="410" stroke="#2563eb" stroke-width="1.5" marker-end="url(#g2)"/>
  <rect x="760" y="370" width="150" height="80" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="774" y="394" class="bt">model router</text>
  <text x="774" y="414" class="bd">alias → provider</text>
  <text x="774" y="432" class="bd">fallback, price</text>

  <line x1="910" y1="410" x2="932" y2="410" stroke="#2563eb" stroke-width="1.5" marker-end="url(#g2)"/>
  <rect x="936" y="370" width="104" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="948" y="394" class="bt">provider</text>
  <text x="948" y="414" class="bd">external</text>
  <text x="948" y="432" class="bd">key here only</text>

  <line x1="595" y1="450" x2="595" y2="482" stroke="#2563eb" stroke-width="1.5" marker-end="url(#g2)"/>
  <rect x="470" y="486" width="250" height="80" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="484" y="510" class="bt">run log + budgets</text>
  <text x="484" y="530" class="bd">audit · traces · spend</text>
  <text x="484" y="548" class="bd">shared across tasks</text>

  <path d="M 700 450 L 700 520 L 756 520" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#g2)"/>
  <text x="708" y="470" class="edge">tool call</text>

  <rect x="760" y="486" width="150" height="80" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="774" y="510" class="bt">tool executor</text>
  <text x="774" y="530" class="bd">allowlist, caps</text>
  <text x="774" y="548" class="bd">untrusted output</text>

  <line x1="910" y1="526" x2="932" y2="526" stroke="#2563eb" stroke-width="1.5" marker-end="url(#g2)"/>
  <rect x="936" y="486" width="104" height="80" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="948" y="510" class="bt">tools</text>
  <text x="948" y="530" class="bd">MCP / HTTP</text>
  <text x="948" y="548" class="bd">no ambient creds</text>

  <!-- registry pins the data plane -->
  <path d="M 400 449 L 430 449 L 430 290 L 466 290" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#g1)"/>

  <text x="466" y="600" class="bd" font-style="italic">the data plane reads a pinned version and its policy; it never writes either</text>

  <text x="32" y="682" class="note">That separation is what lets a team move fast without being able to change a budget ceiling, a model allowlist or a safety profile.</text>
</svg>
