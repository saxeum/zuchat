<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="t d">
  <title id="t">What a product team owns and what it never needs to know</title>
  <desc id="d">The team owns a manifest, prompts, schemas, evals and its UI. A single contract of publish and run sits between the team and the platform. Below that line the platform owns provider keys, streaming, quotas, tools, identity, infrastructure, evals and deploy, and a team never reads that code.</desc>
  <rect width="1100" height="700" fill="#ffffff"/>
  <style>
    .h1{font:700 24px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .sub{font:400 13px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .kick{font:700 9px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1px}
    .ct{font:700 11.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .cs{font:400 9.5px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#64748b}
    .contract{font:700 11px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#1d4ed8}
    .note{font:400 11px 'Inter','Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <text x="32" y="46" class="h1">What a team owns, and what it must never need to know</text>
  <text x="32" y="70" class="sub">The platform is the red area. If a product team has to cross that line, the abstraction leaked.</text>

  <!-- owned layer -->
  <rect x="40" y="100" width="1020" height="128" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="56" y="124" class="kick" fill="#1d4ed8">PRODUCT TEAM OWNS</text>
  <rect x="56" y="138" width="188" height="72" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="70" y="160" class="ct">agent.yaml</text>
  <text x="70" y="178" class="cs">model alias, tools, budget</text>
  <text x="70" y="194" class="cs">owner, labels, safety profile</text>
  <rect x="256" y="138" width="188" height="72" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="270" y="160" class="ct">prompts/</text>
  <text x="270" y="178" class="cs">instructions, in git</text>
  <text x="270" y="194" class="cs">versioned with the agent</text>
  <rect x="456" y="138" width="188" height="72" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="470" y="160" class="ct">schemas/</text>
  <text x="470" y="178" class="cs">input and output shapes</text>
  <text x="470" y="194" class="cs">typed for the UI and SDK</text>
  <rect x="656" y="138" width="188" height="72" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="670" y="160" class="ct">evals/</text>
  <text x="670" y="178" class="cs">fixtures and pass-rate bar</text>
  <text x="670" y="194" class="cs">the team's quality gate</text>
  <rect x="856" y="138" width="188" height="72" rx="7" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="870" y="160" class="ct">their UI</text>
  <text x="870" y="178" class="cs">layout and interaction</text>
  <text x="870" y="194" class="cs">via the SDK, not raw SSE</text>

  <!-- contract -->
  <line x1="150" y1="228" x2="150" y2="254" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="550" y1="228" x2="550" y2="254" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="950" y1="228" x2="950" y2="254" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="40" y="258" width="1020" height="88" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="56" y="282" class="kick" fill="#1d4ed8">THE ONLY CONTRACT</text>
  <rect x="56" y="292" width="480" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="70" y="317" class="contract">publish a version · validate → eval → registry</text>
  <rect x="548" y="292" width="496" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="562" y="317" class="contract">call a run · POST /v1/agents/{name}/runs → typed events</text>

  <!-- ignored layer -->
  <line x1="150" y1="346" x2="150" y2="392" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="550" y1="346" x2="550" y2="392" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="950" y1="346" x2="950" y2="392" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="40" y="398" width="1020" height="248" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.6"/>
  <text x="56" y="422" class="kick" fill="#991b1b">PLATFORM OWNS · A TEAM NEVER READS THIS</text>

  <rect x="56" y="438" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="68" y="458" class="ct">provider keys</text>
  <text x="68" y="476" class="cs">model routing, fallback, price</text>
  <rect x="302" y="438" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="314" y="458" class="ct">token accounting</text>
  <text x="314" y="476" class="cs">cost, usage, attribution</text>
  <rect x="548" y="438" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="560" y="458" class="ct">streaming protocol</text>
  <text x="560" y="476" class="cs">frames, heartbeats, cancellation</text>
  <rect x="794" y="438" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="806" y="458" class="ct">retries and timeouts</text>
  <text x="806" y="476" class="cs">provider and tool failure modes</text>

  <rect x="56" y="500" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="68" y="520" class="ct">quota structures</text>
  <text x="68" y="538" class="cs">shared counters, per tenant</text>
  <rect x="302" y="500" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="314" y="520" class="ct">cookies and JWT</text>
  <text x="314" y="538" class="cs">session checks, rotation, clock</text>
  <rect x="548" y="500" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="560" y="520" class="ct">tool sandbox</text>
  <text x="560" y="538" class="cs">allowlist, call caps, credentials</text>
  <rect x="794" y="500" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="806" y="520" class="ct">Terraform and IAM</text>
  <text x="806" y="538" class="cs">ALB, tasks, secrets, roles</text>

  <rect x="56" y="562" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="68" y="582" class="ct">registry</text>
  <text x="68" y="600" class="cs">immutable versions, channels</text>
  <rect x="302" y="562" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="314" y="582" class="ct">eval harness</text>
  <text x="314" y="600" class="cs">fixtures, pass-rate gate</text>
  <rect x="548" y="562" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="560" y="582" class="ct">traces and alarms</text>
  <text x="560" y="600" class="cs">one trace per run, per-agent SLOs</text>
  <rect x="794" y="562" width="232" height="52" rx="7" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="806" y="582" class="ct">deploy and rollback</text>
  <text x="806" y="600" class="cs">canary, pin, kill switch</text>

  <text x="32" y="678" class="note">Above the contract is data a team edits. Below it is code one team maintains. The width of that gap is the platform.</text>
</svg>
