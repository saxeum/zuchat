name: deploy

# Runs only after CI succeeded on master: no deploying an image whose tests
# failed, and no path from a pull request to production.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions:
  id-token: write   # OIDC to AWS
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-2
      REPO: 619071335809.dkr.ecr.ap-southeast-2.amazonaws.com/zuchat
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::619071335809:role/zuchat-gha-deploy
          aws-region: ${{ env.AWS_REGION }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build --platform linux/amd64 -t "$REPO:$SHA" -t "$REPO:latest" .
          docker push "$REPO:$SHA"
          docker push "$REPO:latest"

      - name: Roll the service
        run: |
          aws ecs update-service --cluster zuchat --service zuchat \
            --force-new-deployment --region "$AWS_REGION" >/dev/null
          echo "deployed $SHA"
