name: terraform-apply

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

# One apply at a time. Two merges close together used to race for the S3 lock
# and one of them failed with a spurious "Error acquiring the state lock".
concurrency:
  group: terraform-state
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The OIDC subject is repo:...:environment:production, and that Environment
    # requires a reviewer (defined in terraform/github), so the approval is part
    # of the credential boundary. That is also why every action here is pinned to
    # a commit SHA: a repointed tag would run with the apply role.
    environment: production
    env:
      AWS_REGION: ap-southeast-2
      REPO: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-2.amazonaws.com/zuchat
      SHA: ${{ github.event.workflow_run.head_sha }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/zuchat-tf-apply-production
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${REPO%%/*}"
          docker build --platform linux/amd64 -t "$REPO:$SHA" -t "$REPO:latest" .
          docker push "$REPO:$SHA"
          docker push "$REPO:latest"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.17.1"

      - name: Apply with the image pinned to this commit
        working-directory: terraform/ecs
        env:
          TF_VAR_deepseek_secret_arn: ${{ vars.DEEPSEEK_SECRET_ARN || secrets.DEEPSEEK_SECRET_ARN }}
          TF_VAR_session_secret_arn: ${{ vars.SESSION_SECRET_ARN || secrets.SESSION_SECRET_ARN }}
          TF_VAR_google_client_secret_arn: ${{ vars.GOOGLE_CLIENT_SECRET_ARN || secrets.GOOGLE_CLIENT_SECRET_ARN }}
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_enable_https: ${{ vars.ENABLE_HTTPS || 'true' }}
          TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN || secrets.CERTIFICATE_ARN }}
          TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS || secrets.ALLOWED_EMAILS }}
          TF_VAR_image_tag: ${{ env.SHA }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
