name: terraform-plan

# Plan only, on pull requests, with credentials that cannot write.
on: pull_request

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/ecs
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/zuchat-tf-plan
          aws-region: ap-southeast-2
          mask-aws-account-id: true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"

      - name: Init
        run: terraform init -input=false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Plan
        env:
          TF_VAR_deepseek_secret_arn: ${{ vars.DEEPSEEK_SECRET_ARN || secrets.DEEPSEEK_SECRET_ARN }}
          TF_VAR_session_secret_arn: ${{ vars.SESSION_SECRET_ARN || secrets.SESSION_SECRET_ARN }}
          TF_VAR_google_client_secret_arn: ${{ vars.GOOGLE_CLIENT_SECRET_ARN || secrets.GOOGLE_CLIENT_SECRET_ARN }}
          TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          TF_VAR_enable_https: ${{ vars.ENABLE_HTTPS || 'true' }}
          TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN || secrets.CERTIFICATE_ARN }}
          TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS || secrets.ALLOWED_EMAILS }}
        run: terraform plan -no-color -input=false -lock=false
